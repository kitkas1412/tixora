name: tixora

services:
  postgres:
    image: postgres:17.12
    container_name: tixora-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TIXORA_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${TIXORA_DB_NAME:-tixora}
      POSTGRES_USER: ${TIXORA_DB_USER:-tixora}
      POSTGRES_PASSWORD: ${TIXORA_DB_PASSWORD:?set TIXORA_DB_PASSWORD in environment/.env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - tixora-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    container_name: tixora-redis
    image: redis:8.6.8-alpine
    ports:
      - "6319:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: tixora-prometheus
    restart: unless-stopped
    volumes:
      - ./data/prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: tixora-grafana
    hostname: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SING_UP=false
      - GF_SERVER_DOMAIN=localhost
      - GF_LOG_MODE=console file
      - GF_LOG_FILTERS=alerting.notifier.slack:debug alermanager:debug ngalert:debug
    ports:
      - '3000:3000'
    volumes:
      - './grafana_storage:/var/lib/grafana'

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - '9100:9100'

volumes:
  tixora-pg-data:
