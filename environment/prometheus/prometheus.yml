global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "tixora-prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:9090"]
    metrics_path: "/metrics"

  - job_name: "tixora-springboot"
    scrape_interval: 5s
    static_configs:
      - targets: [ "host.docker.internal:8081" ]
    metrics_path: "/actuator/prometheus"

  - job_name: "tixora-node-exporter"
    scrape_interval: 5s
    static_configs:
      - targets: [ "host.docker.internal:9100" ]