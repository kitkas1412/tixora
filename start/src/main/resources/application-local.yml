spring:
  docker:
    compose:
      enabled: true
      file: environment/compose.yaml
      lifecycle-management: start-only
  flyway:
    locations: classpath:db/migration,classpath:db/seed

logging:
  level:
    org.hibernate.SQL: debug

management:
  server:
    port: 8081
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,metrics,mappings,env,configprops,flyway,loggers,circuitbreakers,ratelimiters,prometheus
